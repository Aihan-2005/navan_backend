[project]
name = "navan-backend"
version = "0.1.0"
description = "Navan Django backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2.16,<5.3",
    "djangorestframework>=3.17.1,<3.18",
    "djangorestframework-simplejwt[crypto]>=5.5.1,<5.6",
    "django-cors-headers>=4.9,<5",
    "django-environ>=0.14,<0.15",
    "drf-spectacular>=0.30,<0.31",
    "psycopg[binary]>=3.3,<3.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "DJ",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_test.py",
]
testpaths = [
    "apps",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
