[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "DJ",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_test.py",
]
testpaths = [
    "apps",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
